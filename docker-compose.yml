
services:
  craftworkshop-db:
    image: postgres:16
    container_name: craftworkshop-db
    environment:
      POSTGRES_DB: exam_2400090216
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - craftworkshop_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400090216"]
      interval: 10s
      timeout: 5s
      retries: 10

  craftworkshop-backend:
    image: keerthinarne26/docker-backend-2400090216:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: craftworkshop-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://craftworkshop-db:5432/exam_2400090216
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      craftworkshop-db:
        condition: service_healthy

  craftworkshop-frontend:
    image: keerthinarne26/docker-frontend-2400090216:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: craftworkshop-frontend
    ports:
      - "8082:80"
    depends_on:
      - craftworkshop-backend

volumes:
  craftworkshop_db_data:
